name: Release

# Every pushed SemVer tag (including fork build metadata such as vX.Y.Z+ys.N) becomes a GitHub
# Release whose notes carry the update commands — the
# in-app update banner links here, so the page a user lands on tells them exactly how to update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble release notes (CHANGELOG section + update commands)
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          # This version's CHANGELOG block: everything between its exact `## [version]` heading and
          # the next. Prefix matching avoids treating SemVer `+` build metadata as an awk regex.
          awk -v "heading=## [$version]" '
            index($0, heading) == 1 { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md" || true
          {
            if [ -s "$RUNNER_TEMP/changelog.md" ]; then
              cat "$RUNNER_TEMP/changelog.md"
              echo
            fi
            echo "## Update"
            echo
            echo "For a release within your installed major, update the plugin — advances the checkout, rebuilds, and restarts:"
            echo
            echo '```'
            echo "herdr plugin action invoke update --plugin herdr.collie"
            echo '```'
            echo
            echo "If this release starts a newer major, read its migration notes and explicitly consent to the crossing:"
            echo
            echo '```'
            echo "herdr plugin action invoke update-major --plugin herdr.collie"
            echo '```'
            echo
            echo "Or just restart the bridge to pick up an already-built change:"
            echo
            echo '```'
            echo "herdr plugin action invoke restart --plugin herdr.collie"
            echo '```'
          } > "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Collie $GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.file }}"
